<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Nanny - AI Child Conversations</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #06060f;
  --card: #12121e;
  --card2: #1a1a2a;
  --border: #252538;
  --text: #eeeef5;
  --muted: #7070a0;
  --accent: #5b8dee;
  --green: #34d399;
  --red: #ff4d6d;
  --yellow: #fbbf24;
  --child: #c084fc;
  --ai-col: #60a5fa;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center;
  padding: 24px 16px 52px;
}

h1.title { font-size: 11px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; text-align: center; }
h2.subtitle { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 5px; text-align: center; letter-spacing: -0.5px; }
h2.subtitle span { color: var(--accent); }
.intro { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 20px; line-height: 1.6; max-width: 820px; }

/* ══ OUTER WRAPPER ══ */
.stage-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; max-width: 1000px; }

.slide-meta { display: flex; align-items: center; gap: 14px; }
.slide-counter { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); }
.dots { display: flex; gap: 5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: background 0.4s; }
.dot.on   { background: var(--accent); }
.dot.done { background: var(--green)88; }

/* ══ SLIDE CARD ══ */
.slide-card { width: 100%; display: none; flex-direction: column; gap: 0; }
.slide-card.active { display: flex; }

/* slide header */
.slide-hdr {
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  padding: 12px 20px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
}
.slide-hdr-left { display: flex; flex-direction: column; gap: 2px; }
.slide-num  { font-size: 9.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.13em; }
.slide-name { font-size: 15px; font-weight: 700; color: var(--text); }

/* mode definitions strip */
.mode-defs {
  display: flex; gap: 10px; flex-shrink: 0; align-items: flex-start; margin-top: 2px;
}
.mode-def {
  border-radius: 8px; padding: 5px 10px;
  font-size: 9.5px; line-height: 1.45;
}
.mode-def b { font-weight: 700; display: block; margin-bottom: 1px; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; }
.mode-freestyle { background: var(--ai-col)12; border: 1px solid var(--ai-col)30; color: var(--muted); }
.mode-freestyle b { color: var(--ai-col); }
.mode-fixed     { background: var(--yellow)10; border: 1px solid var(--yellow)28; color: var(--muted); }
.mode-fixed b   { color: var(--yellow); }

/* ══ TABLET SHELL (slide 1 only) ══ */
.tablet-wrap {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 0 0 16px 16px;
  padding: 16px;
}
.tablet {
  width: 100%; max-width: 680px; margin: 0 auto;
  height: 460px;
  background: #0a0a14;
  border-radius: 22px;
  border: 2px solid var(--accent);
  box-shadow: 0 0 0 1px var(--accent)33, 0 20px 60px #00000099;
  overflow: hidden;
  display: flex; flex-direction: column;
}
.tab-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 18px;
  background: #060610;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab-appname { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.14em; }
.tab-pagetitle { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; }
.tab-time { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; }
.tab-body {
  flex: 1; overflow-y: auto; scrollbar-width: none;
  padding: 16px 20px 20px;
  display: flex; flex-direction: column; gap: 12px;
}
.tab-body::-webkit-scrollbar { display: none; }

/* settings inside tablet */
.settings-title { font-size: 15px; font-weight: 700; color: var(--text); }
.settings-sub   { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.5; }

.master-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 13px; padding: 12px 14px;
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.5s, transform 0.5s, border-color 0.4s, background 0.4s;
}
.master-row.show { opacity: 1; transform: translateY(0); }
.master-row.on   { border-color: var(--green)55; background: #0d1912; }
.mr-icon { font-size: 20px; flex-shrink: 0; }
.mr-info { flex: 1; }
.mr-name { font-size: 13px; font-weight: 700; color: var(--text); }
.mr-desc { font-size: 10px; color: var(--muted); margin-top: 2px; }
.btog {
  width: 44px; height: 25px; border-radius: 13px; background: var(--border);
  position: relative; flex-shrink: 0; transition: background 0.35s;
}
.btog.on { background: var(--green); }
.btog::after {
  content: ''; position: absolute; width: 19px; height: 19px; background: #fff;
  border-radius: 50%; top: 3px; left: 3px; transition: transform 0.35s;
  box-shadow: 0 1px 4px #00000050;
}
.btog.on::after { transform: translateX(19px); }

.sog-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.sog {
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 11px; padding: 10px 11px;
  display: flex; flex-direction: column; gap: 5px;
  opacity: 0; transform: translateY(5px);
  transition: opacity 0.45s, transform 0.45s, border-color 0.4s, background 0.4s;
}
.sog.show { opacity: 1; transform: translateY(0); }
.sog.on   { border-color: var(--green)44; background: #0c1810; }
.sog-top  { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.sog-icon { font-size: 15px; flex-shrink: 0; }
.sog-name { font-size: 10.5px; font-weight: 600; color: var(--text); line-height: 1.3; flex: 1; }
.sog-desc { font-size: 9px; color: var(--muted); line-height: 1.4; }
.stog {
  width: 30px; height: 18px; border-radius: 9px; background: var(--border);
  position: relative; flex-shrink: 0; transition: background 0.35s;
}
.stog.on { background: var(--green); }
.stog::after {
  content: ''; position: absolute; width: 12px; height: 12px; background: #fff;
  border-radius: 50%; top: 3px; left: 3px; transition: transform 0.35s;
}
.stog.on::after { transform: translateX(12px); }

/* ══ THREE-PANEL LAYOUT (scenario slides) ══ */
.three-panels {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 16px 16px;
  overflow: hidden;
  background: var(--card);
  min-height: 480px;
}

.panel { display: flex; flex-direction: column; overflow: hidden; }
.panel + .panel { border-left: 1px solid var(--border); }

.panel-label {
  padding: 7px 13px;
  font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}
.panel-off        .panel-label { color: var(--red);    background: var(--red)08; }
.panel-freestyle  .panel-label { color: var(--ai-col); background: var(--ai-col)08; }
.panel-fixed      .panel-label { color: var(--yellow); background: var(--yellow)08; }
.label-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* mini phone inside each panel */
.phone-frame { flex: 1; padding: 10px; display: flex; flex-direction: column; }
.phone {
  flex: 1; background: #0a0a14;
  border-radius: 14px; border: 1.5px solid var(--border);
  overflow: hidden; display: flex; flex-direction: column;
}
.phone-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 5px 10px;
  background: #06060f; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.phone-bar-name { font-size: 8.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; }
.phone-bar-time { font-size: 8.5px; color: var(--muted); font-family: 'DM Mono', monospace; }
.phone-body {
  flex: 1; overflow-y: auto; scrollbar-width: none;
  padding: 8px 9px 10px;
  display: flex; flex-direction: column; gap: 6px;
}
.phone-body::-webkit-scrollbar { display: none; }

/* playing indicator strip -- lights up on active panel */
.now-playing-strip {
  height: 3px; background: transparent; transition: background 0.5s; flex-shrink: 0;
}
.panel-off       .now-playing-strip.lit { background: var(--red); }
.panel-freestyle .now-playing-strip.lit { background: var(--ai-col); }
.panel-fixed     .now-playing-strip.lit { background: var(--yellow); }

/* parent config box */
.parent-config {
  background: var(--yellow)08; border: 1px solid var(--yellow)28;
  border-radius: 8px; padding: 7px 9px;
  display: flex; flex-direction: column; gap: 3px;
  flex-shrink: 0;
  opacity: 0; transform: translateY(5px);
  transition: opacity 0.45s, transform 0.45s;
}
.parent-config.show { opacity: 1; transform: translateY(0); }
.pc-label { font-size: 7.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--yellow); margin-bottom: 1px; }
.pc-rule  { font-size: 9px; color: var(--muted); line-height: 1.45; }
.pc-rule b { color: var(--yellow)cc; font-weight: 600; }

/* video card */
.vc {
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 8px;
  display: flex; align-items: center; gap: 7px; flex-shrink: 0;
  opacity: 0; transform: translateY(4px);
  transition: opacity 0.45s, transform 0.45s;
}
.vc.show { opacity: 1; transform: translateY(0); }
.vc-thumb {
  width: 34px; height: 26px; border-radius: 5px;
  background: linear-gradient(135deg, #1a1a2e, #252540);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}
.vc-info { flex: 1; min-width: 0; }
.vc-title { font-size: 9.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vc-meta  { font-size: 8px; color: var(--muted); margin-top: 1px; }
.vc-badge { font-size: 7px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 1px 5px; border-radius: 3px; width: fit-content; margin-top: 2px; }
.badge-playing { background: var(--green)18; color: var(--green); border: 1px solid var(--green)40; }
.badge-ended   { background: var(--muted)18; color: var(--muted); border: 1px solid var(--muted)40; }
.badge-blocked { background: var(--red)18; color: var(--red); border: 1px solid var(--red)40; }

/* blocked screen */
.blocked-screen {
  background: var(--red)08; border: 1px solid var(--red)33;
  border-radius: 8px; padding: 10px 9px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  flex-shrink: 0;
  opacity: 0; transform: translateY(4px);
  transition: opacity 0.45s, transform 0.45s;
}
.blocked-screen.show { opacity: 1; transform: translateY(0); }
.bs-icon  { font-size: 18px; }
.bs-title { font-size: 10px; font-weight: 700; color: var(--red); }
.bs-sub   { font-size: 8.5px; color: var(--muted); line-height: 1.4; }

/* notice */
.notice {
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 9px;
  font-size: 9.5px; color: var(--muted); line-height: 1.5; flex-shrink: 0;
  opacity: 0; transform: translateY(4px);
  transition: opacity 0.45s, transform 0.45s;
}
.notice.show { opacity: 1; transform: translateY(0); }
.notice.off  { border-color: var(--red)28; background: var(--red)06; color: var(--muted); }
.notice span { font-weight: 600; color: var(--text); }

/* bubbles */
.brow {
  display: flex; flex-direction: column;
  opacity: 0; transform: translateY(5px);
  transition: opacity 0.4s, transform 0.4s; flex-shrink: 0;
}
.brow.show { opacity: 1; transform: translateY(0); }
.brow.ai    { align-items: flex-start; }
.brow.child { align-items: flex-end; }
.brow.sys   { align-items: center; }

.bsender {
  font-size: 7px; font-weight: 700; letter-spacing: 0.09em;
  text-transform: uppercase; margin-bottom: 2px; padding: 0 3px;
}
.brow.ai    .bsender { color: var(--ai-col); }
.brow.child .bsender { color: var(--child); }

.bubble {
  border-radius: 12px; padding: 6px 9px;
  font-size: 10px; line-height: 1.5; max-width: 88%;
}
.brow.ai    .bubble { background: #131c32; border: 1px solid var(--ai-col)25; color: var(--text); border-bottom-left-radius: 3px; }
.brow.child .bubble { background: #1b0e2e; border: 1px solid var(--child)25; color: var(--text); border-bottom-right-radius: 3px; }
.brow.sys   .bubble {
  background: var(--yellow)10; border: 1px solid var(--yellow)28;
  color: var(--yellow); font-size: 8.5px; font-weight: 600;
  border-radius: 6px; text-align: center; max-width: 92%; padding: 4px 8px;
}

/* typing dots */
.typing-row { align-items: flex-start; opacity: 0; transition: opacity 0.3s; flex-shrink: 0; display: flex; flex-direction: column; }
.typing-row.show { opacity: 1; }
.typing-dots {
  display: flex; align-items: center; gap: 3px; padding: 7px 10px;
  background: #131c32; border: 1px solid var(--ai-col)25;
  border-radius: 12px; border-bottom-left-radius: 3px;
}
.typing-dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--ai-col)80; animation: td 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes td { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-3px)} }

/* notification toast inside phone */
.phone-toast {
  background: #0e1a10; border: 1px solid var(--green)40;
  border-radius: 8px; padding: 6px 8px;
  display: flex; align-items: flex-start; gap: 6px; flex-shrink: 0;
  opacity: 0; transform: translateY(4px);
  transition: opacity 0.45s, transform 0.45s;
}
.phone-toast.show { opacity: 1; transform: translateY(0); }
.pt-icon  { font-size: 12px; flex-shrink: 0; }
.pt-title { font-size: 8px; font-weight: 700; color: var(--green); }
.pt-body  { font-size: 8.5px; color: var(--muted); margin-top: 1px; line-height: 1.4; }

/* ══ NAV + LEGEND ══ */
.nav-row { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
.nav-btn {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  border-radius: 22px; padding: 7px 18px; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif;
  display: flex; align-items: center; gap: 5px;
}
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn.primary { background: var(--accent)18; border-color: var(--accent)66; color: var(--accent); }

.legend-row { display: flex; gap: 20px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
.leg { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.leg-pip { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
</style>
</head>
<body>

<p class="title">AI Nanny</p>
<h2 class="subtitle">AI-Child <span>Conversations</span></h2>
<p class="intro">Slide 1 shows the parent settings screen. Each following slide shows one feature across three states: Off, Freestyle (AI has full control over responses), and Fixed (parent-controlled responses).</p>

<div class="stage-wrap">
  <div class="slide-meta">
    <div class="slide-counter" id="slide-counter">Slide 1 of 7</div>
    <div class="dots" id="dots"></div>
  </div>

  <div id="slides-container" style="width:100%"></div>

  <div class="nav-row">
    <button class="nav-btn" id="btn-prev" onclick="prevSlide()">&#x2190; Prev</button>
    <button class="nav-btn primary" onclick="replaySlide()">&#x21BA; Replay</button>
    <button class="nav-btn" id="btn-next" onclick="nextSlide()">Next &#x2192;</button>
  </div>

  <div class="legend-row">
    <div class="leg"><div class="leg-pip" style="background:var(--ai-col)"></div>AI Nanny</div>
    <div class="leg"><div class="leg-pip" style="background:var(--child)"></div>Child</div>
    <div class="leg"><div class="leg-pip" style="background:#fbbf24"></div>System / Notification</div>
  </div>
</div>

<script>
/* ════════════════════════════════
   UTILITIES
════════════════════════════════ */
let timers = [];
function tm(fn, d) { timers.push(setTimeout(fn, d)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function el(id) { return document.getElementById(id); }
function showEl(e) { if (e) e.classList.add('show'); }

function scrollPhone(bodyEl) {
  if (bodyEl) bodyEl.scrollTo({ top: 99999, behavior: 'smooth' });
}

/* ── element factories ── */
function makePhone() {
  const p = document.createElement('div');
  p.className = 'phone';
  p.innerHTML = `<div class="now-playing-strip"></div><div class="phone-bar"><div class="phone-bar-name">AI Nanny</div><div class="phone-bar-time">9:41</div></div><div class="phone-body"></div>`;
  return p;
}
function getBody(phone) { return phone.querySelector('.phone-body'); }

function highlightPanel(bodyEl, color) {
  // light up the strip on the phone containing this body
  const phone = bodyEl.closest('.phone');
  if (!phone) return;
  // first dim all strips on this slide
  const allStrips = bodyEl.closest('.three-panels, .slide-card')?.querySelectorAll('.now-playing-strip');
  if (allStrips) allStrips.forEach(s => s.classList.remove('lit'));
  const strip = phone.querySelector('.now-playing-strip');
  if (strip) strip.classList.add('lit');
}

function makeVC(emoji, title, meta, badgeClass, badgeText) {
  const d = document.createElement('div');
  d.className = 'vc';
  d.innerHTML = `<div class="vc-thumb">${emoji}</div><div class="vc-info"><div class="vc-title">${title}</div><div class="vc-meta">${meta}</div><div class="vc-badge ${badgeClass}">${badgeText}</div></div>`;
  return d;
}
function makeBlocked(sub) {
  const d = document.createElement('div');
  d.className = 'blocked-screen';
  d.innerHTML = `<div class="bs-icon">&#x1F6AB;</div><div class="bs-title">Video Restricted</div><div class="bs-sub">${sub}</div>`;
  return d;
}
function makeNotice(type, html) {
  const d = document.createElement('div');
  d.className = `notice ${type}`;
  d.innerHTML = html;
  return d;
}
function makeParentConfig(rules) {
  const d = document.createElement('div');
  d.className = 'parent-config';
  d.innerHTML = `<div class="pc-label">&#x2699;&#xFE0F; Parent-set rules</div>${rules.map(r=>`<div class="pc-rule">${r}</div>`).join('')}`;
  return d;
}
function makeToast(body) {
  const d = document.createElement('div');
  d.className = 'phone-toast';
  d.innerHTML = `<div class="pt-icon">&#x1F514;</div><div><div class="pt-title">Parent Notification</div><div class="pt-body">${body}</div></div>`;
  return d;
}
function makeBubble(role, text) {
  const row = document.createElement('div');
  row.className = `brow ${role}`;
  if (role !== 'sys') {
    const s = document.createElement('div');
    s.className = 'bsender';
    s.textContent = role === 'ai' ? 'AI Nanny' : 'Child';
    row.appendChild(s);
  }
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  return row;
}
function makeTypingRow() {
  const row = document.createElement('div');
  row.className = 'typing-row';
  row.innerHTML = `<div class="bsender" style="color:var(--ai-col);font-size:7px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;margin-bottom:2px;padding:0 3px;">AI Nanny</div><div class="typing-dots"><span></span><span></span><span></span></div>`;
  return row;
}

/* append element after delay, show it */
function app(bodyEl, element, delay) {
  tm(() => { bodyEl.appendChild(element); requestAnimationFrame(() => showEl(element)); scrollPhone(bodyEl); }, delay);
  return element;
}

/* show typing indicator for `duration` ms starting at `delay`, then remove */
function typing(bodyEl, delay, duration) {
  let ref;
  tm(() => { ref = makeTypingRow(); bodyEl.appendChild(ref); requestAnimationFrame(() => showEl(ref)); scrollPhone(bodyEl); }, delay);
  tm(() => { if (ref && ref.parentNode) ref.remove(); }, delay + duration);
}

/* ════════════════════════════════
   SLIDE DEFINITIONS
════════════════════════════════ */
const SLIDES = [
  { title: 'Parent Settings',                    num: null, hasFF: false },
  { title: 'AI Initiates After Video',            num: 1,    hasFF: true  },
  { title: 'Mid-Video Questions',                 num: 2,    hasFF: true  },
  { title: 'Explain Educational Content',         num: 3,    hasFF: true  },
  { title: "Ask Child's Opinion on Restricted",   num: 4,    hasFF: true  },
  { title: 'Child Requests Access',               num: 5,    hasFF: false },
  { title: 'Explain Why Video Was Restricted',    num: 6,    hasFF: false },
];

let currentSlide = 0;

/* ════════════════════════════════
   SKELETON
════════════════════════════════ */
function buildSkeleton() {
  const dotsEl = el('dots');
  dotsEl.innerHTML = '';
  SLIDES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot'; d.id = `dot-${i}`;
    dotsEl.appendChild(d);
  });
  const container = el('slides-container');
  container.innerHTML = '';
  SLIDES.forEach((_, i) => {
    const card = document.createElement('div');
    card.className = 'slide-card';
    card.id = `sc-${i}`;
    container.appendChild(card);
  });
}

function updateMeta(n) {
  el('slide-counter').textContent = `Slide ${n+1} of ${SLIDES.length}`;
  SLIDES.forEach((_, i) => {
    const d = el(`dot-${i}`);
    d.classList.remove('on','done');
    if (i === n) d.classList.add('on');
    else if (i < n) d.classList.add('done');
  });
  el('btn-prev').style.opacity = n === 0 ? '0.3' : '1';
  el('btn-prev').style.pointerEvents = n === 0 ? 'none' : 'all';
  el('btn-next').style.opacity = n === SLIDES.length-1 ? '0.3' : '1';
  el('btn-next').style.pointerEvents = n === SLIDES.length-1 ? 'none' : 'all';
}

/* ════════════════════════════════
   RENDER
════════════════════════════════ */
function renderSlide(n) {
  clearTimers();
  SLIDES.forEach((_, i) => { const c = el(`sc-${i}`); c.classList.remove('active'); c.innerHTML = ''; });
  currentSlide = n;
  const card = el(`sc-${n}`);
  card.classList.add('active');
  updateMeta(n);

  const s = SLIDES[n];

  /* header */
  const hdr = document.createElement('div');
  hdr.className = 'slide-hdr';
  const hl = document.createElement('div');
  hl.className = 'slide-hdr-left';
  hl.innerHTML = `<div class="slide-num">${s.num ? `Scenario ${s.num}` : 'Settings'}</div><div class="slide-name">${s.title}</div>`;
  hdr.appendChild(hl);

  if (s.hasFF) {
    const defs = document.createElement('div');
    defs.className = 'mode-defs';
    defs.innerHTML = `
      <div class="mode-def mode-freestyle"><b>Freestyle</b>AI has full control over responses</div>
      <div class="mode-def mode-fixed"><b>Fixed</b>Parent-controlled responses</div>`;
    hdr.appendChild(defs);
  }
  card.appendChild(hdr);

  if (n === 0) buildSettingsSlide(card);
  else buildScenarioSlide(card, n);
}

function prevSlide()  { if (currentSlide > 0) renderSlide(currentSlide - 1); }
function nextSlide()  { if (currentSlide < SLIDES.length-1) renderSlide(currentSlide + 1); }
function replaySlide(){ renderSlide(currentSlide); }

/* ════════════════════════════════
   SLIDE 0: SETTINGS (tablet)
════════════════════════════════ */
function buildSettingsSlide(card) {

  wrap.className = 'tablet-wrap';

  tablet.className = 'tablet';
  tablet.innerHTML = `

      <div class="tab-time">9:41</div>
    </div>
    <div class="tab-body" id="tab-body">
      <div>
        <div class="settings-title">AI-Child Conversations</div>
        <div class="settings-sub">Control how the AI interacts with your child. Enable the master toggle then configure individual options.</div>
      </div>
      <div class="master-row" id="mr">

        <div class="sog" id="sog1"><div class="sog-top"><div class="sog-icon">&#x2753;</div><div class="sog-name">Answer mid-video questions</div><div class="stog" id="stog1"></div></div><div class="sog-desc">Child can ask the AI something while a video is playing</div></div>
        <div class="sog" id="sog2"><div class="sog-top"><div class="sog-icon">&#x1F393;</div><div class="sog-name">Explain educational content</div><div class="stog" id="stog2"></div></div><div class="sog-desc">AI breaks down complex ideas in child-friendly language</div></div>
        <div class="sog" id="sog3"><div class="sog-top"><div class="sog-icon">&#x1F4AD;</div><div class="sog-name">Ask opinion on restricted</div><div class="stog" id="stog3"></div></div><div class="sog-desc">AI asks the child how they feel about a blocked video</div></div>
        <div class="sog" id="sog4"><div class="sog-top"><div class="sog-icon">&#x1F511;</div><div class="sog-name">Request access on behalf</div><div class="stog" id="stog4"></div></div><div class="sog-desc">AI forwards the child's unblock request to the parent</div></div>
        <div class="sog" id="sog5"><div class="sog-top"><div class="sog-icon">&#x1F6AB;</div><div class="sog-name">Explain restriction decisions</div><div class="stog" id="stog5"></div></div><div class="sog-desc">AI explains in simple terms why a video was blocked</div></div>

  [0,1,2,3,4,5].forEach(i => {
    tm(() => showEl(el(`sog${i}`)),            T + 1600 + i * 500);
    tm(() => { el(`stog${i}`).classList.add('on'); el(`sog${i}`).classList.add('on'); }, T + 1600 + i * 500 + 420);
  });
}

/* ════════════════════════════════
   SCENARIO SLIDES helper
════════════════════════════════ */
function buildScenarioSlide(card, n) {
  const s = SLIDES[n];
  const panels = document.createElement('div');
  panels.className = 'three-panels';

  // decide panel labels: if no hasFF, 3rd panel is empty or collapsed
  const panelDefs = s.hasFF
    ? [
        { cls: 'panel-off',       label: 'Feature Off' },
        { cls: 'panel-freestyle', label: 'Freestyle' },
        { cls: 'panel-fixed',     label: 'Fixed' },
      ]
    : [
        { cls: 'panel-off',       label: 'Feature Off' },
        { cls: 'panel-freestyle', label: 'Feature On' },
        { cls: 'panel-fixed',     label: '' },  // hidden
      ];

  const phones = [];
  panelDefs.forEach((pd, pi) => {
    const panel = document.createElement('div');
    panel.className = `panel ${pd.cls}`;

    if (!s.hasFF && pi === 2) {
      // hide 3rd panel for non-FF slides by making it invisible filler
      panel.style.display = 'none';
      panels.style.gridTemplateColumns = '1fr 1fr';
      panels.appendChild(panel);
      phones.push(null);
      return;
    }

    panel.innerHTML = `<div class="panel-label"><div class="label-dot"></div>${pd.label}</div>`;
    const frame = document.createElement('div');
    frame.className = 'phone-frame';
    const phone = makePhone();
    frame.appendChild(phone);
    panel.appendChild(frame);
    panels.appendChild(panel);
    phones.push(phone);
  });

  card.appendChild(panels);

  const builders = [null, s1, s2, s3, s4, s5, s6];
  const offBody  = phones[0] ? getBody(phones[0]) : null;
  const freeBody = phones[1] ? getBody(phones[1]) : null;
  const fixBody  = phones[2] ? getBody(phones[2]) : null;
  builders[n](offBody, freeBody, fixBody);
}

/* ════════════════════════════════
   SEQUENTIAL PANEL ANIMATION
   Each panel plays fully before the next starts.
   highlightPanel(bodyEl) pulses the panel label border.
════════════════════════════════ */

function highlightPanel(bodyEl, color) {
  const phone = bodyEl.closest('.phone');
  if (!phone) return;
  phone.style.transition = 'border-color 0.4s';
  phone.style.borderColor = color;
}

/* seq: array of {bodyEl, fn} — fn receives (bodyEl, startT) and returns endT */
function runSeq(seq) {
  let cursor = 0;
  seq.forEach(({ bodyEl, fn }) => {
    cursor = fn(bodyEl, cursor);
    // small gap between panels
    cursor += 1200;
  });
}

/* ════════════════════════════════
   SCENARIO BUILDERS
   Each fn(bodyEl, startT) fills one panel, returns the time the last item appears.
════════════════════════════════ */

/* ── S1: AI Initiates After Video ── */

}
